<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prize Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎁 Choose a Box to WIN a Prize 🎁</h1>
    <p>Click on any mystery box below to open it.</p>

    <div class="game-container">
        <div class="prixe-box">
            <input type="checkbox" id="box1" class="box-trigger">
            <label for="box1" class="box-label">📦</label>
            <div class="prize-reveal">💵 $500</div>
        </div>

        <div class="prize-box">
            <input type="checkbox" id="box2" class="box-trigger">
            <label for="box2" class="box-label">📦</label>
            <div class="prize-reveal">🍿 Movie Tickets</div>
        </div>

        <div class="prize-box">
            <input type="checkbox" id="box3" class="box-trigger">
            <label for="box3" class="box-label">📦</label>
            <div class="prize-reveal">💻 New Laptop</div>
        </div>
    </div>
</body>
</html>
